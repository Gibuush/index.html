<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Especial - Lía Ailany</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Paleta: salvia + terracota + crema + dorado */
            --sage-light: #e7e9dc;
            --sage: #a9b596;
            --sage-deep: #6f7d5c;
            --terracotta: #c3805f;
            --terracotta-deep: #96543a;
            --gold-accent: #b9945a;
            --champagne-bg: #f7f4ec;
            --warm-white: #fffdf8;
            --text-dark: #3c3a32;
            --text-muted: #857f70;
            --night-1: #241d13;
            --night-2: #14100a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--night-2);
            background-image:
                radial-gradient(at 15% 10%, rgba(169, 181, 150, 0.25) 0px, transparent 55%),
                radial-gradient(at 85% 90%, rgba(195, 128, 95, 0.22) 0px, transparent 55%),
                radial-gradient(circle at 50% 50%, var(--night-1) 0%, var(--night-2) 100%);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Estrellitas animadas de fondo */
        .stars-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            color: var(--gold-accent);
            opacity: 0;
            animation: twinkle linear infinite;
        }

        .star.sage { color: var(--sage); }
        .star.terracotta { color: var(--terracotta); }

        @keyframes twinkle {
            0% { opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
            15% { opacity: 0.65; transform: translateY(-10px) scale(1) rotate(45deg); }
            50% { opacity: 0.35; transform: translateY(-25px) scale(0.85) rotate(90deg); }
            85% { opacity: 0.65; transform: translateY(-40px) scale(1) rotate(135deg); }
            100% { opacity: 0; transform: translateY(-55px) scale(0.6) rotate(180deg); }
        }

        /* Control de música */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--night-1);
            border: 1px solid var(--gold-accent);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-accent);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .music-control:hover { transform: scale(1.08); }

        /* Tarjeta principal */
        .card-container {
            background: var(--warm-white);
            width: 100%;
            max-width: 480px;
            border-radius: 32px;
            box-shadow: 0 25px 55px rgba(111, 125, 92, 0.18);
            overflow: hidden;
            position: relative;
            z-index: 2;
            text-align: center;
            border: 1px solid rgba(169, 181, 150, 0.35);
            animation: cardAppear 1.1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-arch {
            background: linear-gradient(160deg, var(--sage) 0%, var(--sage-deep) 100%);
            padding: 32px 25px 48px 25px;
            position: relative;
            border-radius: 32px 32px 0 0;
        }

        .top-arch::after {
            content: "";
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: var(--gold-accent);
            opacity: 0.8;
        }

        .sub-heading {
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.62rem;
            color: var(--champagne-bg);
            opacity: 0.9;
            font-weight: 600;
        }

        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--warm-white);
            line-height: 1.1;
            margin-top: 4px;
        }

        .event-tag {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            font-size: 0.7rem;
            color: var(--champagne-bg);
            margin-top: 10px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .image-wrapper {
            width: 34%;
            margin: -42px auto 0 auto;
            border-radius: 50%;
            padding: 6px;
            background: var(--warm-white);
            box-shadow: 0 10px 25px rgba(111, 125, 92, 0.25);
            position: relative;
            z-index: 2;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .bunny-img {
            width: 100%;
            height: auto;
            border-radius: 50%;
            display: block;
            border: 2px solid var(--sage-light);
        }

        .welcome-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            line-height: 1.45;
            color: var(--text-dark);
            padding: 14px 40px 0 40px;
            font-style: italic;
        }

        .countdown-title {
            font-family
