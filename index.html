<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Especial - Lía Ailany</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <!-- Librería Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        :root {
            --pastel-pink: #fce4ec;
            --soft-pink: #f8bbd0;
            --rose-accent: #d87093;
            --gold-accent: #e6c594;
            --warm-white: #ffffff;
            --text-dark: #5a4a42;
            --text-muted: #8c7b73;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #fff0f5 0%, #f7e8ee 100%);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Contenedor Interactivo 3D */
        .card-container {
            background: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 440px;
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(248, 187, 208, 0.4), 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 8px solid var(--warm-white);
            outline: 1px solid var(--pastel-pink);
            overflow: hidden;
            position: relative;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            animation: cardAppear 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Encabezado Animado */
        .header-section {
            padding: 35px 20px 10px 20px;
            background: linear-gradient(180deg, #fff5f8 0%, rgba(255,255,255,0) 100%);
        }

        .sub-heading {
            font-family: 'Playfair Display', serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeInDown 1s forwards 0.4s;
        }

        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--rose-accent);
            text-shadow: 2px 3px 6px rgba(216, 112, 147, 0.15);
            line-height: 1.1;
            opacity: 0;
            animation: fadeInDown 1s forwards 0.6s;
            margin-top: 5px;
        }

        /* Marco Flotante con Conejita */
        .image-wrapper {
            position: relative;
            width: 65%;
            margin: 5px auto;
            border-radius: 50%;
            padding: 10px;
            background: radial-gradient(circle, rgba(252,228,236,0.9) 0%, rgba(255,255,255,0) 70%);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .bunny-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(216, 112, 147, 0.25));
        }

        /* Contador Regresivo (Countdown) */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 25px 10px 25px;
        }

        .time-box {
            background: #fff8fa;
            border: 1px solid #fce4ec;
            padding: 8px;
            border-radius: 12px;
            min-width: 58px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .time-box span {
            display: block;
        }

        .time-num {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--rose-accent);
        }

        .time-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Grid de Detalles */
        .details-section {
            padding: 10px 25px 35px 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .info-card {
            background: #fff8fa;
            border: 1px solid #fce4ec;
            padding: 12px 10px;
            border-radius: 16px;
        }

        .info-icon { font-size: 1.1rem; display: block; margin-bottom: 3px; }
        .info-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .info-value { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 0.88rem; color: var(--text-dark); }

        .location-box {
            background: #fff8fa;
            border: 1px solid #fce4ec;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        /* Botón Asistido por Axios */
        .cta-button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #f48fb1 0%, #d87093 100%);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 15px 0;
            border-radius: 30px;
            box-shadow: 0 6px 18px rgba(216, 112, 147, 0.35);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 22px rgba(216, 112, 147, 0.45);
        }

        .cta-button:disabled {
            background: #d3d3d3;
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card-container" id="card">
        <div class="header-section">
            <p class="sub-heading">¡Acompáñanos a celebrar!</p>
            <h1 class="main-title">Lía Ailany</h1>
        </div>

        <div class="image-wrapper">
            <!-- Recuerda colocar aquí la ruta o URL de tu imagen de la conejita -->
            <img class="bunny-img" src="tu_imagen_conejita.png" alt="Conejita Lía Ailany">
        </div>

        <!-- Contador Regresivo -->
        <div class="countdown-container">
            <div class="time-box"><span class="time-num" id="days">00</span><span class="time-label">Días</span></div>
            <div class="time-box"><span class="time-num" id="hours">00</span><span class="time-label">Horas</span></div>
            <div class="time-box"><span class="time-num" id="minutes">00</span><span class="time-label">Min</span></div>
            <div class="time-box"><span class="time-num" id="seconds">00</span><span class="time-label">Seg</span></div>
        </div>

        <div class="details-section">
            <div class="info-grid">
                <div class="info-card">
                    <span class="info-icon">📅</span>
                    <div class="info-label">Fecha</div>
                    <div class="info-value">19 de Septiembre</div>
                </div>
                <div class="info-card">
                    <span class="info-icon">⏰</span>
                    <div class="info-label">Hora</div>
                    <div class="info-value">1:00 PM</div>
                </div>
            </div>

            <div class="location-box">
                <span class="info-icon">📍</span>
                <div class="info-label">Lugar</div>
                <div class="info-value">Jardín de Eventos "Ma Salon"</div>
            </div>

            <button class="cta-button" id="confirmBtn" onclick="confirmAssistance()">
                Confirmar Asistencia
            </button>
        </div>
    </div>

    <script>
        // 1. Contador Regresivo actualizado al 19 de Septiembre, 1:00 PM
        const eventDate = new Date("September 19, 2026 13:00:00").getTime();

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const difference = eventDate - now;

            if (difference < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-container").innerHTML = "<p style='color:var(--rose-accent); font-weight:600;'>¡El evento ha comenzado!</p>";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? '0' + days : days;
            document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
        }, 1000);

        // 2. Efecto Parallax en 3D
        const card = document.getElementById("card");

        document.addEventListener("mousemove", (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener("mouseleave", () => {
            card.style.transform = "rotateY(0deg) rotateX(0deg)";
        });

        // 3. Confirmación con Axios y redirección
        function confirmAssistance() {
            const btn = document.getElementById("confirmBtn");
            btn.innerText = "Registrando...";
            btn.disabled = true;

            axios.post('https://httpbin.org/post', {
                event: 'Baby Shower Lía Ailany',
                status: 'Confirmed',
                timestamp: new Date()
            })
            .then(response => {
                btn.innerText = "¡Asistencia Confirmada! ✨";
                btn.style.background = "linear-gradient(135deg, #a8e6cf 0%, #56ab2f 100%)";
                
                // Redirecciona al WhatsApp de confirmación con el mensaje personalizado
                setTimeout(() => {
                    const mensaje = encodeURIComponent("¡Hola! Confirmo mi asistencia al evento de Lía Ailany este 19 de Septiembre.");
                    window.open(`https://wa.me/tuNumeroDeTelefono?text=${mensaje}`, "_blank");
                }, 1200);
            })
            .catch(error => {
                btn.innerText = "Error, intentar de nuevo";
                btn.disabled = false;
                console.error("Error al registrar:", error);
            });
        }
    </script>
</body>
</html>
